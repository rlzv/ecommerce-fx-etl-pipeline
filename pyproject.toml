[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-fx-etl"
version = "0.1.0"
description = "End-to-end orders and foreign-exchange ETL pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Robi Borovitchii" }]
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "requests>=2.32,<3",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-requests>=2.32,<3",
]

[project.scripts]
ecommerce-etl = "ecommerce_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ecommerce_etl = [
  "sql/marts/*.sql",
  "sql/migrations/*.sql",
  "sql/transformations/*.sql",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ecommerce_etl"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ecommerce_etl"]
mypy_path = "src"
