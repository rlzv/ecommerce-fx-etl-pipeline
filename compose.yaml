services:
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-fx-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_etl}
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl_password}
    ports:
      - "5433:5432"
    volumes:
      - ecommerce_fx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etl_user} -d ${POSTGRES_DB:-ecommerce_etl}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  ecommerce_fx_postgres_data:

