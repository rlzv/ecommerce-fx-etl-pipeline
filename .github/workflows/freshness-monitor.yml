name: Pipeline Freshness Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  workflow_run:
    workflows: ["Daily ETL Pipeline"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ecommerce-fx-freshness-monitor
  cancel-in-progress: false

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Fail when the upstream workflow failed
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: exit 1

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Check pipeline and mart freshness
        run: ecommerce-etl check-freshness --max-age-hours 26
